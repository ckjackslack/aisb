name: release

# Cut a release in either of two ways:
#   - push a tag vX.Y.Z; or
#   - Actions -> release -> Run workflow with tag=vX.Y.Z. If the tag doesn't exist yet, it is created on the
#     commit the run was started from (by `gh release create --target`).
# One build feeds a GitHub release (sdist, wheel, aisb.pyz, man pages + completions, SHA256SUMS) and, when the repository variable
# PYPI_PUBLISH is "true", PyPI via trusted publishing. Re-running for an existing tag never rewrites the assets
# of a published release, so it is also how an existing tag gets published to PyPI later.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag, e.g. v0.2.0 (created on the selected branch's head if it doesn't exist)"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: resolve
        name: resolve the tag to a commit
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "::error::tag must look like v1.2.3, got '$TAG'"; exit 1 ;; esac
          if git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            git checkout -q "refs/tags/$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: version tag matches the package
        run: |
          pip install -e ".[dev]"
          test "v$(python -c 'import aisb; print(aisb.__version__)')" = "${{ steps.resolve.outputs.tag }}"
      - name: tests (release only what passes)
        run: pytest -q -m "not docker" -p no:cacheprovider
      - name: sdist + wheel (PyPI), the single-file bundle and man pages + completions (GitHub only)
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          pip install build
          python -m build --outdir dist
          mkdir bundle && aisb bundle bundle/aisb.pyz
          python3 -I bundle/aisb.pyz --version
          # share/ in the layout packagers expect: extract into a prefix such as /usr/local or ~/.local
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          mkdir -p share/bash-completion/completions share/zsh/site-functions share/fish/vendor_completions.d
          aisb docs --man share/man/man1
          aisb completion bash > share/bash-completion/completions/aisb
          aisb completion zsh > share/zsh/site-functions/_aisb
          aisb completion fish > share/fish/vendor_completions.d/aisb.fish
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
            -czf "bundle/aisb-${TAG#v}-share.tar.gz" share
          sha256sum dist/* bundle/* | sed 's|  .*/|  |' > bundle/SHA256SUMS
      - name: release notes from CHANGELOG.md (empty when the version has no section)
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          mkdir notes
          python - <<'PY'
          import os, re
          version = os.environ["TAG"].removeprefix("v")
          text = open("CHANGELOG.md").read() if os.path.exists("CHANGELOG.md") else ""
          m = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.M | re.S)
          open("notes/notes.md", "w").write(m.group(1).strip() + "\n" if m else "")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes/
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: bundle/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: notes
          path: notes
      - name: create the release (and its tag), complete an empty one, or leave a published one alone
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          if ! assets=$(gh release view "$TAG" --json assets --jq '.assets | length' 2>/dev/null); then
            if [ -s notes/notes.md ]; then notes=(--notes-file notes/notes.md); else notes=(--generate-notes); fi
            gh release create "$TAG" out/* --target "$SHA" --title "aisb $TAG" "${notes[@]}"
          elif [ "$assets" = 0 ]; then
            gh release upload "$TAG" out/*      # e.g. a release drafted in the GitHub UI
          else
            echo "release $TAG already has $assets assets; not replacing them"
          fi

  pypi:
    if: vars.PYPI_PUBLISH == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aisb/
    permissions:
      id-token: write   # trusted publishing: PyPI verifies this workflow's OIDC identity
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true   # re-runs for an already-uploaded version succeed instead of failing
