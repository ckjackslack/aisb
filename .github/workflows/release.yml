name: release

# Tag push (vX.Y.Z): build once, attach sdist + wheel + .pyz + SHA256SUMS to a GitHub release, and publish
# to PyPI when the repository variable PYPI_PUBLISH is "true" (trusted publishing, no token stored).
# Manual run: re-publish an existing tag to PyPI, e.g. after trusted publishing was set up.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to publish to PyPI (e.g. v0.2.0)"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: version tag matches the package
        run: |
          pip install -e ".[dev]"
          test "v$(python -c 'import aisb; print(aisb.__version__)')" = "${{ steps.tag.outputs.tag }}"
      - name: tests (release only what passes)
        run: pytest -q -m "not docker" -p no:cacheprovider
      - name: sdist + wheel (PyPI) and the single-file bundle (GitHub only)
        run: |
          pip install build
          python -m build --outdir dist
          mkdir bundle && aisb bundle bundle/aisb.pyz
          python3 -I bundle/aisb.pyz --version
          sha256sum dist/* bundle/* | sed 's|  .*/|  |' > bundle/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: bundle/

  github-release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${{ needs.build.outputs.tag }}" out/* --title "aisb ${{ needs.build.outputs.tag }}" --generate-notes

  pypi:
    if: vars.PYPI_PUBLISH == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aisb/
    permissions:
      id-token: write   # trusted publishing: PyPI verifies this workflow's OIDC identity
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
