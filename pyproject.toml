[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aisb"
version = "0.1.0"
description = "stdlib-only Docker Engine API client with an agent-friendly CLI and Claude Code skill"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
pyinfra = ["pyinfra>=3.1"]

[project.scripts]
aisb = "aisb.cli:main"

[project.entry-points."pyinfra.connectors"]
aisb = "aisb.contrib.pyinfra.connector:AisbConnector"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["docker: needs a reachable Docker daemon (auto-skipped otherwise)"]
