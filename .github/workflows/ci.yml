name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests examples
      - run: mypy
      - name: generated docs are current
        run: |
          python -m aisb docs > /tmp/commands.md
          diff -u .claude/skills/docker/references/commands.md /tmp/commands.md

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,pyinfra]"
      - name: zsh and fish, so their completion tests run too
        if: matrix.python == '3.12'
        run: sudo apt-get install -y -qq zsh fish > /dev/null
      - name: pull images used by the live tests
        run: |
          for i in alpine:3.20 busybox:1.36 nginx:alpine redis:7-alpine postgres:16-alpine mariadb:11 mysql:8.4; do docker pull -q "$i"; done
      - name: unit + live tests with branch coverage (the runner has a Docker daemon)
        run: pytest -q --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: coverage
          path: coverage.xml

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: aisb bundle aisb.pyz
      - name: the bundle runs with nothing but the stdlib
        run: python3 -I aisb.pyz docs > /dev/null && python3 -I aisb.pyz --version
      - uses: actions/upload-artifact@v4
        with:
          name: aisb.pyz
          path: aisb.pyz

  plugin-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install aisb and the example plugin as a user would
        run: pip install . "./examples/aisb-owners[dev]"
      - run: pytest -q -p no:cacheprovider examples/aisb-owners/tests
      - name: found through its entry point
        run: |
          aisb config show --json | python -c 'import json,sys; p=json.load(sys.stdin)["plugins"]; assert p == {"aisb_owners": "ok"}, p'
          aisb owners stop-unowned --help | grep -q -- --dry-run
          aisb completion bash | grep -q "'owners') echo 'list stop-unowned'"
