[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aisb"
dynamic = ["version"]
description = "stdlib-only Docker Engine API client with an agent-friendly CLI and Claude Code skill"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "ckjackslack" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "pyyaml>=6", "mutmut>=3.3", "pytest-timeout>=2.3", "ruff>=0.6", "mypy>=1.10"]
pyinfra = ["pyinfra>=3.1"]

[project.scripts]
aisb = "aisb.cli:main"

[project.entry-points."pyinfra.connectors"]
aisb = "aisb.contrib.pyinfra.connector:AisbConnector"

[tool.setuptools.dynamic]
version = {attr = "aisb.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "examples/aisb-owners/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
# E501: a few dense lines (tables, SQL, regexes) read better unwrapped; B905: zip() over ragged inputs is intended
ignore = ["E501", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["aisb"]
known-local-folder = ["conftest"]

[tool.mypy]
python_version = "3.11"
files = ["src/aisb", "examples/aisb-owners/src"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["docker: needs a reachable Docker daemon (auto-skipped otherwise)"]

[tool.coverage.run]
source = ["aisb"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 98
exclude_also = ["if TYPE_CHECKING:", 'raise AssertionError\(.unreachable.\)', "raise NotImplementedError", "if __name__ == .__main__.:"]

[tool.mutmut]
# `mutmut run` (see docs/testing.md): mutation testing of the safety core; live Docker tests excluded for speed
source_paths = ["src/aisb"]
do_not_mutate = ["src/aisb/contrib/*"]  # pyinfra introspects fact signatures, which mutmut wraps
also_copy = ["docs", "README.md", ".claude", "LICENSE", "NOTICE", "examples"]
pytest_add_cli_args = ["-p", "no:cacheprovider", "-m", "not docker", "-q", "--timeout", "120",  # a hanging mutant is killed
                       "--deselect", "tests/test_cli.py::test_runtime_imports_are_stdlib_only"]  # mutants import mutmut
pytest_add_cli_args_test_selection = ["tests/"]
